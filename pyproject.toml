[project]
name = "prespyc"
version = "0.1.0"
description = "SWF parsing and resource extraction, in pure Python"
readme = "README.md"
requires-python = ">=3.13"
license = "LGPL-3.0-or-later"
authors = [{ name = "Astariul" }]
keywords = ["swf", "flash", "svg", "webp", "spritesheet"]
dependencies = [
    "pillow>=11",
    "resvg-py>=0.5",
]

[project.urls]
Homepage = "https://github.com/astariul/prespyc"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.6",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prespyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
markers = [
    "slow: long running tests (whole-fixture golden sweeps)",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E741",    # ambiguous names (l, I) are fine for math/geometry code
    "B905",    # zip() strict= is noise in ported loops
    "SIM108",  # ternaries hurt readability in ported branches
    "RUF001",  # unicode look-alikes appear in SWF text fixtures
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
